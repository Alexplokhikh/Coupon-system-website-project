name: CI

on:
  push:
    branches:
      - main
      - modernization
  pull_request:
    branches:
      - main
      - modernization

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cs_app_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d cs_app_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=10s

    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/cs_app_db
      DB_USERNAME: postgres
      DB_PASSWORD: test-password
      HIBERNATE_DDL_AUTO: create-drop
      SHOW_SQL: "false"
      JWT_SECRET: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DEMO_DATA_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: Backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x Backend/mvnw

      - name: Test backend
        working-directory: Backend
        run: ./mvnw -B verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: Frontend
        env:
          CI: "true"
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        working-directory: Frontend
        env:
          CI: "true"
          REACT_APP_API_URL: http://localhost:8080
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --tag coupon-backend:ci ./Backend

      - name: Build frontend image
        run: >
          docker build
          --build-arg REACT_APP_API_URL=http://localhost:8080
          --tag coupon-frontend:ci
          ./Frontend

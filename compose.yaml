services:
  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_DATABASE: cs_app_db
    volumes:
      - coupon-database-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://database:3306/cs_app_db?useSSL=false&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      HIBERNATE_DDL_AUTO: update
      SHOW_SQL: "false"
      PORT: 8080
      DEMO_DATA_ENABLED: "${DEMO_DATA_ENABLED:-true}"
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      args:
        REACT_APP_API_URL: "${REACT_APP_API_URL:-http://localhost:8080}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  coupon-database-data:

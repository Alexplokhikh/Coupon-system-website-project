services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cs_app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - coupon-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://database:5432/cs_app_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      HIBERNATE_DDL_AUTO: update
      SHOW_SQL: "false"
      PORT: 8080
      DEMO_DATA_ENABLED: "${DEMO_DATA_ENABLED:-true}"
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      args:
        REACT_APP_API_URL: "${REACT_APP_API_URL:-http://localhost:8080}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  coupon-postgres-data:
